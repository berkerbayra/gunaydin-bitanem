<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Günaydın Bitanem 🤍</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #24152f, #5b315f, #25162f);
    color: white;
}

.card {
    width: 88%;
    max-width: 430px;
    padding: 38px 25px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 70px rgba(0,0,0,0.4);
    z-index: 2;
}

.small {
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.75;
}

h1 {
    font-size: 36px;
    margin: 20px 0 12px;
}

p {
    font-size: 17px;
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 30px;
    padding: 15px 25px;
    font-size: 16px;
    font-weight: bold;
    color: #693b70;
    background: white;
    cursor: pointer;
}

#message {
    display: none;
}

.music {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    border-radius: 25px;
    background: rgba(255,255,255,0.15);
    color: white;
    text-decoration: none;
}

.heart {
    position: fixed;
    bottom: -40px;
    animation: rise linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes rise {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(-115vh) rotate(30deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="small">SANA ÖZEL BİR SÜRPRİZ 🤍</div>

    <h1 id="title">Bir şey var...</h1>

    <p id="intro">
        Sabah bunu gördüğünde<br>
        önce aşağıdaki butona bas. 👀
    </p>

    <button onclick="surprise()">
        Tıkla bakalım 🤍
    </button>

    <div id="message">

        <h1>GÜNAYDIIN BİTANEMMM 🤍</h1>

        <p>
            Uyandığında yüzünde küçücük de olsa<br>
            bir gülümseme olsun istedim. 🫶🏻
            <br><br>
            Umarım bugün senin için<br>
            çok güzel geçer.
            <br><br>
            <b>Şimdi sıra sabah şarkında... 🎶</b>
        </p>

        <a class="music"
           href="https://www.youtube.com/results?search_query=Yal%C4%B1n+Son+A%C5%9Fk%C4%B1m"
           target="_blank">
            🎵 Son Aşkım'ı aç
        </a>

    </div>

</div>

<script>

function surprise() {

    document.querySelector("button").style.display = "none";
    document.getElementById("title").style.display = "none";
    document.getElementById("intro").style.display = "none";
    document.querySelector(".small").innerHTML =
        "BUGÜNÜN İLK SÜRPRİZİ 🤍";

    document.getElementById("message").style.display = "block";

    for (let i = 0; i < 55; i++) {

        setTimeout(function() {

            const heart = document.createElement("div");

            heart.className = "heart";

            const hearts = ["🤍","💗","💕","💖","❤️","🩷"];

            heart.innerHTML =
                hearts[Math.floor(Math.random() * hearts.length)];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                (16 + Math.random() * 22) + "px";

            heart.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(function() {
                heart.remove();
            }, 9000);

        }, i * 100);
    }
}

</script>

</body>
</html>
