   <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Günaydın Bitanemmm ❤️</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3,#a18cd1);
  color:white;
}

.container{
  width:90%;
  max-width:500px;
  text-align:center;
  padding:35px 20px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.3);
  border-radius:30px;
  backdrop-filter:blur(10px);
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
  font-size:38px;
  margin:10px 0 15px;
}

p{
  font-size:20px;
  line-height:1.6;
}

.hearts{
  font-size:30px;
  animation:beat 1.2s infinite;
}

button{
  margin-top:20px;
  padding:15px 25px;
  border:0;
  border-radius:30px;
  background:white;
  color:#e75480;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

#message{
  display:none;
  margin-top:25px;
  font-size:22px;
  font-weight:bold;
}

@keyframes beat{
  50%{transform:scale(1.25)}
}

.heart{
  position:fixed;
  top:-20px;
  font-size:22px;
  animation:fall linear forwards;
  pointer-events:none;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="hearts">❤️ 💗 💕 💖 💗 ❤️</div>

  <h1>Günaydın Bitanemmm ❤️</h1>

  <p>
    Uyandığında yüzünde küçücük de olsa<br>
    bir gülümseme olsun istedim. 🥹❤️
  </p>

  <p>
    Bugünün çok güzel geçsin,<br>
    çünkü sen güzel bir günü hak ediyorsun. 💕
  </p>

  <button onclick="surprise()">
    Bana tıkla ❤️
  </button>

  <div id="message">
    Günaydın bitanemmm 🥹❤️<br>
    Seni düşündüğümü bil yeter. 💗
    <br><br>
    🎵 Son Aşkım — Yalın
  </div>

</div>

<script>
function surprise(){

  document.getElementById("message").style.display="block";

  for(let i=0;i<30;i++){
    setTimeout(()=>{
      const heart=document.createElement("div");
      heart.className="heart";
      heart.innerHTML=["❤️","💗","💕","💖","💘"][Math.floor(Math.random()*5)];
      heart.style.left=Math.random()*100+"vw";
      heart.style.animationDuration=(3+Math.random()*4)+"s";
      document.body.appendChild(heart);

      setTimeout(()=>heart.remove(),7000);
    },i*80);
  }

  window.open(
    "https://www.youtube.com/watch?v=ERrSFOtSmFY",
    "_blank"
  );
}
</script>

</body>
</html>
